aid: captains-eye
name: Captain's Eye
description: Captain's Eye is a Haifa, Israel-based maritime AI company (founded 2020 by Uri Ben Dor
  and Doron Oizerovich, backed by Techstars) that delivers real-time video analytics software for
  maritime and industrial safety. Its SaaS platform connects to existing CCTV cameras, radar, and
  thermal sensors aboard merchant vessels, yachts, cruise ships, ports, and on-land petrochemical and
  energy sites, applying custom neural networks and commercial AI models to detect fires, smoke, leaks,
  sea pollution, missing protective gear, unauthorized access, and equipment failures. It provides
  real-time alerts, remote monitoring, incident documentation, and operational data collection,
  monitoring 5,000+ cameras and having detected 100,000+ events. Access is delivered through a private
  web application and mobile apps rather than a public developer API.
